name: AEGIS AI - FAANG Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: SRE Quality Gate & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Upgrade Pip & Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pytest
          pip install -r requirements.txt

      - name: Static Application Security Testing (SAST)
        run: |
          bandit -r core/ guardrail/ api/ -ll -ii --exclude ./tests/

      - name: Fast Lint & Syntax Verification (Ruff)
        run: |
          ruff check . --exit-zero

      - name: Execute Full Autonomous SOC Test Suite
        env:
          AEGIS_ENVIRONMENT: test
          PYTHONPATH: .
        run: |
          pytest tests/ -v --maxfail=1 --durations=10
